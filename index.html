<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тамақтану сапасын бағалау | Жас дарын</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #f5b042, #ff8c00);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.95; }
        .content { padding: 30px; }
        .grade-section, .rating-section { margin-bottom: 25px; }
        .grade-title, .rating-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
            font-size: 16px;
        }
        .grade-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .grade-btn {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .grade-btn:hover { background: #ffecb3; border-color: #ffc107; }
        .grade-btn.active {
            background: linear-gradient(135deg, #ffc107, #ff8c00);
            border-color: #ff8c00;
            color: white;
            transform: scale(0.96);
        }
        .rating-options {
            display: flex;
            gap: 15px;
        }
        .rating-option {
            flex: 1;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .rating-option:hover { background: #ffecb3; border-color: #ffc107; }
        .rating-option.selected {
            background: linear-gradient(135deg, #ffc107, #ff8c00);
            border-color: #ff8c00;
            color: white;
            transform: scale(0.96);
        }
        .rating-value { font-size: 48px; font-weight: bold; }
        .rating-text { font-size: 12px; margin-top: 5px; }
        .submit-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .submit-btn:hover { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
        }
        .footer {
            background: #f8f9fa;
            padding: 12px;
            text-align: center;
            font-size: 11px;
            color: #666;
            border-top: 1px solid #eee;
        }
        @media (max-width: 500px) {
            .rating-value { font-size: 32px; }
            .grade-btn { padding: 8px 16px; }
            .rating-options { gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>🍲 Тамақты бағалау</h1>
            <p>Жас дарын</p>
        </div>
        <div class="content">
            <div class="grade-section">
                <div class="grade-title">📚 Сыныпты таңдаңыз:</div>
                <div class="grade-buttons" id="gradeButtons"></div>
            </div>
            <div class="rating-section">
                <div class="rating-title">⭐ Тамақ сапасын бағалаңыз:</div>
                <div class="rating-options" id="ratingOptions">
                    <div class="rating-option" data-score="5">
                        <div class="rating-value">5</div>
                        <div class="rating-text">Өте дәмді</div>
                    </div>
                    <div class="rating-option" data-score="4">
                        <div class="rating-value">4</div>
                        <div class="rating-text">Қанағаттанарлық</div>
                    </div>
                    <div class="rating-option" data-score="3">
                        <div class="rating-value">3</div>
                        <div class="rating-text">Төмен</div>
                    </div>
                </div>
            </div>
            <button class="submit-btn" id="submitBtn">✨ Бағалауды жіберу ✨</button>
            <div id="status" class="status">👆 Сынып пен бағаны таңдаңыз</div>
        </div>
        <div class="footer">
            ⏱️ Деректер Google кестеге сақталада
        </div>
    </div>
    <script>
        // 🔴 МЫНА ЖЕРГЕ ӨЗІҢІЗДІҢ ЖАҢА APPS SCRIPT URL-ІҢІЗДІ ҚОЙЫҢЫЗ!
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvPVL4TfFC2OpS35eINyGZgAyKMc62Q2mnoPbutL6xbveVa3vAZHomPleEuWLYjmo/exec";
        
        let selectedGrade = null;
        let selectedScore = null;
        
        // Сыныптар
        const grades = ["5 сынып", "6 сынып", "7 сынып", "8 сынып", "9 сынып", "10 сынып", "11 сынып"];
        
        // Сынып батырмалары
        const gradeContainer = document.getElementById('gradeButtons');
        grades.forEach(grade => {
            const btn = document.createElement('div');
            btn.className = 'grade-btn';
            btn.textContent = grade;
            btn.onclick = () => {
                document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedGrade = grade;
                updateStatus();
            };
            gradeContainer.appendChild(btn);
        });
        
        // Бағалау батырмалары
        document.querySelectorAll('.rating-option').forEach(opt => {
            opt.onclick = () => {
                document.querySelectorAll('.rating-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedScore = parseInt(opt.dataset.score);
                updateStatus();
            };
        });
        
        function updateStatus() {
            const statusDiv = document.getElementById('status');
            if (selectedGrade && selectedScore) {
                statusDiv.innerHTML = `✅ Таңдалған: ${selectedGrade}, баға: ${selectedScore} балл. Жіберуге дайын!`;
                statusDiv.style.background = "#d4edda";
                statusDiv.style.color = "#155724";
            } else if (selectedGrade) {
                statusDiv.innerHTML = `⚠️ ${selectedGrade} таңдалды. Енді баға таңдаңыз`;
                statusDiv.style.background = "#fff3cd";
                statusDiv.style.color = "#856404";
            } else if (selectedScore) {
                statusDiv.innerHTML = `⚠️ Баға: ${selectedScore} балл. Енді сынып таңдаңыз`;
                statusDiv.style.background = "#fff3cd";
                statusDiv.style.color = "#856404";
            } else {
                statusDiv.innerHTML = `👆 Сынып пен тамақ сапасын таңдаңыз`;
                statusDiv.style.background = "#f8f9fa";
                statusDiv.style.color = "#6c757d";
            }
        }
        
        function getDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }
        
        async function submitData() {
            if (!selectedGrade) {
                alert('Сыныпты таңдаңыз!');
                return;
            }
            if (!selectedScore) {
                alert('Тамақ сапасын бағалаңыз!');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            
            submitBtn.disabled = true;
            submitBtn.textContent = "⏳ Жіберілуде...";
            statusDiv.innerHTML = "📡 Google кестеге жазылуда... Күте тұрыңыз";
            statusDiv.style.background = "#cce5ff";
            statusDiv.style.color = "#004085";
            
            const data = {
                grade: selectedGrade,
                score: selectedScore,
                timestamp: getDateTime()
            };
            
            console.log("Жіберілетін деректер:", data);
            console.log("URL:", SCRIPT_URL);
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(data)
                });
                
                console.log("HTTP статус:", response.status);
                
                const result = await response.json();
                console.log("Сервер жауабы:", result);
                
                if (result.result === "success") {
                    statusDiv.innerHTML = `✅ Сәтті сақталды!<br>📅 ${data.timestamp}<br>📚 ${selectedGrade}<br>⭐ ${selectedScore} балл`;
                    statusDiv.style.background = "#d4edda";
                    statusDiv.style.color = "#155724";
                    
                    // Таңдауларды тазалау
                    document.querySelectorAll('.grade-btn.active').forEach(btn => btn.classList.remove('active'));
                    document.querySelectorAll('.rating-option.selected').forEach(opt => opt.classList.remove('selected'));
                    selectedGrade = null;
                    selectedScore = null;
                    
                    setTimeout(() => updateStatus(), 3000);
                } else {
                    throw new Error(result.message || "Белгісіз қате");
                }
                
            } catch (error) {
                console.error("Қате:", error);
                statusDiv.innerHTML = `❌ Қате: ${error.message}<br><br>🔧 Тексеріңіз:<br>• Apps Script "Кез келген адам" ретінде орналастырылған ба?<br>• Жаңа URL қойылды ма?<br>• Интернет байланысы бар ма?`;
                statusDiv.style.background = "#f8d7da";
                statusDiv.style.color = "#721c24";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "✨ Бағалауды жіберу ✨";
            }
        }
        
        document.getElementById('submitBtn').addEventListener('click', submitData);
        updateStatus();
    </script>
</body>
</html>
